<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ACCESS DENIED</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
        }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(to bottom,
                    rgba(0, 255, 0, 0.05),
                    rgba(0, 255, 0, 0.05) 2px,
                    transparent 2px,
                    transparent 4px);
            pointer-events: none;
            z-index: 999;
        }

        /* Flickering Header */
        h1 {
            color: red;
            text-align: center;
            font-size: 4rem;
            text-shadow: 0 0 20px red;
            animation: flicker 1.5s infinite alternate;
            margin-top: 30px;
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* Skull Animation */
        .skull {
            display: block;
            margin: 0 auto;
            width: 150px;
            animation: pulse 1s infinite;
            filter: drop-shadow(0 0 15px red);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px red);
            }

            50% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 25px red);
            }

            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px red);
            }
        }

        /* Terminal Window */
        .console {
            position: absolute;
            top: 20%;
            left: 5%;
            background-color: rgba(0, 20, 0, 0.9);
            padding: 20px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
            width: 90%;
            height: 60%;
            overflow-y: auto;
            font-size: 1rem;
        }

        /* Warning Blink */
        .warning {
            color: red;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            font-size: 1.5rem;
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* Progress Bar */
        .progress {
            background-color: #222;
            border: 1px solid #00ff00;
            height: 20px;
            width: 100%;
            margin-top: 5px;
        }

        .progress-bar {
            background-color: red;
            height: 100%;
            width: 0%;
            transition: width 0.2s linear;
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>

    <h1>⚠ ACCESS DENIED ⚠</h1>
    <div class="console" id="console">
        <p>[SYSTEM] Unauthorized access detected...</p>
        <p>[FIREWALL] Breach attempt logged.</p>
        <p>[TRACE] Tracking intruder's IP...</p>
        <p>[GPS] Location triangulated...</p>
        <p>[COUNTERMEASURE] Deploying malware...</p>
        <div class="progress">
            <div class="progress-bar" id="bar"></div>
        </div>
        <p class="warning">!!! LEAVE IMMEDIATELY OR FACE CONSEQUENCES !!!</p>
    </div>
    <script>
        const logs = [
            "[SYSTEM] Accessing secure servers...",
            "[TRACE] Reverse connection established.",
            "[ALERT] Injecting trojan payload...",
            "[FIREWALL] Activating counter-hack...",
            "[GPS] Pinpointing location...",
            "[WARNING] Law enforcement notified...",
            "[MALWARE] Encrypting attacker files..."
        ];
        const consoleDiv = document.getElementById("console");
        let i = 0;
        function addLog() {
            if (i < logs.length) {
                const p = document.createElement("p");
                p.textContent = logs[i++];
                consoleDiv.appendChild(p);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
                setTimeout(addLog, 1500);
            }
        }
        addLog();

        // Fake Progress Bar
        let bar = document.getElementById("bar");
        let width = 0;
        setInterval(() => {
            if (width < 100) {
                width += 5;
                bar.style.width = width + "%";
            }
        }, 300);
    </script>

</body>

</html>
