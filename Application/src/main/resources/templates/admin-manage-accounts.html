<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Accounts - FAKE BANK OF INDIA</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f4c75, #3282b8);
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .manage-container {
            max-width: 1200px;
            margin: 80px auto 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        .table-custom {
            margin-top: 20px;
        }

        .table-custom thead th {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffd700;
        }

        .table-custom tbody tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .table-custom tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .table-custom td, .table-custom th {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .btn-freeze {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        
        .btn-freeze:hover {
            background-color: #c82333;
            border-color: #c82333;
        }
        
        .btn-unfreeze {
            background-color: #28a745;
            border-color: #28a745;
        }
        
        .btn-unfreeze:hover {
            background-color: #218838;
            border-color: #218838;
        }
    </style>
</head>
<body>
    <div class="manage-container">
        <h2>Manage User Accounts</h2>
        
        <div th:if="${success}" class="alert alert-success text-center">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>
        
        <table class="table table-dark table-striped table-custom">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Account Holder</th>
                    <th>Verified</th>
                    <th>Frozen</th>
                    <th>Balance</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="account : ${accounts}">
                    <td th:text="${account.id}"></td>
                    <td th:text="${account.username}"></td>
                    <td th:text="${account.accountHolder}"></td>
                    <td th:text="${account.verified}"></td>
                    <td th:text="${account.frozen}"></td>
                    <td th:text="${account.balance}"></td>
                    <td>
                        <div th:if="${account.frozen}">
                            <form th:action="@{/admin/unfreeze-account}" method="post" style="display:inline;">
                                <input type="hidden" name="accountId" th:value="${account.id}">
                                <button type="submit" class="btn btn-unfreeze btn-sm">Unfreeze</button>
                            </form>
                        </div>
                        <div th:unless="${account.frozen}">
                            <form th:action="@{/admin/freeze-account}" method="post" style="display:inline;">
                                <input type="hidden" name="accountId" th:value="${account.id}">
                                <button type="submit" class="btn btn-freeze btn-sm">Freeze</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary mt-3">Back to Admin Dashboard</a>
    </div>
</body>
</html>
