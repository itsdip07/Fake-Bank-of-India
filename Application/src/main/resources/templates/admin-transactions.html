<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Transactions - FAKE BANK OF INDIA</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f4c75, #3282b8);
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .manage-container {
            max-width: 1200px;
            margin: 80px auto 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        .table-custom {
            margin-top: 20px;
        }

        .table-custom thead th {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffd700;
        }

        .table-custom tbody tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .table-custom tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .table-custom td, .table-custom th {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .btn-home {
            background-color: #3282b8;
            border-color: #3282b8;
            color: white;
            transition: background-color 0.3s ease;
        }
        
        .btn-home:hover {
            background-color: #0f4c75;
            border-color: #0f4c75;
        }
        .text-success { color: #28a745; }
        .text-danger { color: #dc3545; }

    </style>
</head>
<body>
    <div class="manage-container">
        <h2>All Bank Transactions</h2>
        
        <div th:if="${success}" class="alert alert-success text-center">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>
        
        <table class="table table-dark table-striped table-custom">
            <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>Account ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tx : ${transactions}">
                    <td th:text="${tx.id}"></td>
                    <td th:text="${tx.account.id}"></td>
                    <td th:text="${tx.type}"></td>
                    <td th:text="${tx.amount}"
                        th:classappend="${tx.type.equalsIgnoreCase('DEPOSIT') or tx.type.startsWith('Recieved_from')} ? 'text-success' : 'text-danger'">
                    </td>
                    <td th:text="${tx.timestamp}"></td>
                </tr>
            </tbody>
        </table>
        <a th:href="@{/admin/dashboard}" class="btn btn-home mt-3">Back to Admin Dashboard</a>
    </div>
</body>
</html>
