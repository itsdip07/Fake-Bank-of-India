<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f4c75, #3282b8);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .otp-container h3 {
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .otp-container p {
            color: #b0b0b0;
            margin-bottom: 30px;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-align: center;
            height: 50px;
            font-size: 1.5rem;
            letter-spacing: 5px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: #5dadec;
            box-shadow: 0 0 0 0.25rem rgba(93, 173, 236, 0.25);
            color: #ffffff;
        }

        .btn-primary {
            background-color: #3282b8;
            border-color: #3282b8;
            font-weight: 600;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0f4c75;
            border-color: #0f4c75;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
            color: #ffffff;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        .alert-custom {
            margin-top: 20px;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* Styling for the green success box you showed */
        .alert-success-redirect {
            background-color: #d1e7dd;
            color: #0f5132;
            padding: 1rem;
            border-radius: 0.25rem;
            border: 1px solid #badbcc;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="otp-container">
        <div th:if="${verificationSuccess}" class="alert-success-redirect">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                <path
                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
            </svg>
            <span>OTP Verified! Account Created Successfully. Redirecting to login page...</span>
        </div>

        <h3 th:if="!${verificationSuccess}">Verify Your OTP</h3>
        <p th:if="!${verificationSuccess}">A 6-digit One-Time Password has been sent to your registered Email ID &
            Mobile number.</p>

        <div th:if="${error}" class="alert alert-danger alert-custom" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success alert-custom" th:text="${success}"></div>

        <form th:if="!${verificationSuccess}" th:action="@{/otp/verify}" method="post" class="mt-4">
            <input type="hidden" name="accountId" th:value="${accountId}">
            <div class="mb-4">
                <input type="text" name="otp" maxlength="6" class="form-control" placeholder="Enter OTP" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
        </form>
        <hr class="my-4" th:if="!${verificationSuccess}">

        <form th:if="!${verificationSuccess}" th:action="@{/otp/resend}" method="post">
            <input type="hidden" name="accountId" th:value="${accountId}">
            <p>Didn't receive the OTP?</p>
            <button type="submit" name="resend" class="btn btn-secondary">Resend OTP</button>
        </form>
    </div>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // ✅ This script now checks for a specific "verificationSuccess" variable
        var verificationSuccessful = [[${ verificationSuccess }]];
        if (verificationSuccessful) {
            setTimeout(function () {
                window.location.href = '/login';
            }, 3000); // 3-second delay
        }
        /*]]>*/
    </script>
</body>

</html>
