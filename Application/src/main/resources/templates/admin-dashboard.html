<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard - FAKE BANK OF INDIA</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f4c75, #3282b8);
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .admin-container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
            text-align: center;
        }

        .btn-admin {
            background-color: #3282b8;
            border-color: #3282b8;
            color: white;
            transition: background-color 0.3s ease;
        }

        .btn-admin:hover {
            background-color: #0f4c75;
            border-color: #0f4c75;
        }

        .btn-logout {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .btn-logout:hover {
            background-color: #c82333;
            border-color: #c82333;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <h2>Admin Dashboard</h2>
        <p>Welcome, Administrator!</p>
        <div class="mt-4">
            <a th:href="@{/admin/accounts}" class="btn btn-admin btn-lg">Manage Accounts</a>
            <a th:href="@{/admin/transactions}" class="btn btn-admin btn-lg ml-3">View All Transactions</a>
            <a th:href="@{/logout}" class="btn btn-logout btn-lg ml-3">Logout</a>
        </div>
    </div>
</body>

</html>
